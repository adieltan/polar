<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts - Polar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

  <header class="container header">
    <a href="/" class="brand">
      <span class="color-dot"></span>
      <span>Polar</span>
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="/about">About</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/posts">Posts</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="section">
      <h1>Posts</h1>
      <p class="lead">
        Writings?
      </p>

      <div style="margin-top: 2rem;">
        <ul id="posts-container" class="posts-list">
          <li style="color: var(--text-muted); font-size: 0.9rem;">Loading posts...</li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="container footer">
    <p>&copy; 2026 Snow</p>
    <ul class="nav-links">
      <li><a href="/terms">Terms of Service</a></li>
      <li><a href="/privacy">Privacy Policy</a></li>
      <li><a href="https://github.com/adieltan" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://discord.gg/dHGqUZNqCu" target="_blank" rel="noopener">Discord</a></li>
    </ul>
  </footer>

  <script>
    async function loadPosts() {
      const container = document.getElementById("posts-container");
      try {
        const res = await fetch("/posts/index.json");
        const posts = await res.json();

        if (!posts || posts.length === 0) {
          container.innerHTML = '<li style="color: var(--text-muted);">No posts published yet.</li>';
          return;
        }

        function formatMonth(dateStr) {
          if (!dateStr) return "";
          const date = new Date(dateStr);
          return date.toLocaleDateString("en-US", { month: "short", year: "numeric" });
        }

        container.innerHTML = posts.map(post => `
          <li class="post-item">
            <div class="post-meta">
              <span class="post-date">${formatMonth(post.date)}</span>
              <a href="/post?post=${post.slug}" class="post-title">${post.title}</a>
            </div>
            <p class="post-desc">${post.description}</p>
          </li>
        `).join("");
      } catch (err) {
        container.innerHTML = '<li style="color: var(--text-muted);">Failed to load posts list.</li>';
      }
    }
    loadPosts();
  </script>

</body>

</html>
