<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

  <header class="container header">
    <a href="/" class="brand">
      <span class="color-dot"></span>
      <span>Polar</span>
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="/about">About</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/posts">Posts</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="section">
      <h1><span id="greeting" class="greeting-text">Hello.</span></h1>
      <p class="lead">
        Hehe
      </p>
    </section>
  </main>

  <footer class="container footer">
    <p>&copy; 2026 Snow</p>
    <ul class="nav-links">
      <li><a href="/terms">Terms of Service</a></li>
      <li><a href="/privacy">Privacy Policy</a></li>
      <li><a href="https://github.com/adieltan" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://discord.gg/dHGqUZNqCu" target="_blank" rel="noopener">Discord</a></li>
    </ul>
  </footer>

  <script>
    const greetings = [
      "Hello.",
      "你好。",
      "Hallo.",
      "안녕하세요.",
      "Apa khabar?",
    ];
    let i = 0;
    const el = document.getElementById("greeting");

    setInterval(() => {
      el.classList.add("fade-out");
      setTimeout(() => {
        i = (i + 1) % greetings.length;
        el.textContent = greetings[i];
        el.style.transform = "translateY(6px)";
        el.offsetHeight; // Force reflow
        el.classList.remove("fade-out");
        el.style.transform = "";
      }, 350);
    }, 2200);
  </script>
</body>

</html>
