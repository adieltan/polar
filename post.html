<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... - Polar</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("post");
    if (slug) {
      window.location.replace("/posts/" + encodeURIComponent(slug));
    } else {
      window.location.replace("/posts");
    }
  </script>
</head>

<body style="font-family: system-ui, sans-serif; padding: 2rem; color: #4b5563;">
  <p>Redirecting to article... <a id="fallback" href="/posts" style="color: #2563eb;">Click here if not redirected</a>.</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("post");
    if (slug) {
      const fb = document.getElementById("fallback");
      fb.href = "/posts/" + encodeURIComponent(slug);
    }
  </script>
</body>

</html>
