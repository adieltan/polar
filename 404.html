<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in the Snow | Polar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=5">
  <style>
    .notfound-wrapper {
      padding: 4rem 0 3rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-family: var(--font-mono);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .notfound-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin: 0;
    }

    .notfound-text {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 520px;
      line-height: 1.6;
    }

    .lost-path {
      font-family: var(--font-mono);
      background: var(--surface);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      word-break: break-all;
      color: var(--text);
    }

    .action-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.92rem;
      transition: all 0.2s ease;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-action:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .btn-primary:hover {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }
  </style>
</head>

<body>

  <header class="container header">
    <a href="/" class="brand">
      <span class="color-dot"></span>
      <span>Polar</span>
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="/about">About</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/posts">Posts</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="notfound-wrapper">
      <div class="status-badge">
        <span class="dot"></span>
        <span>Error 404 &middot; Page Not Found</span>
      </div>

      <h1 class="notfound-title">Lost in the blizzard.</h1>

      <p class="notfound-text">
        The path <span id="requested-path" class="lost-path"></span> could not be found or has drifted away like fresh snow.
      </p>

      <div class="action-links">
        <a href="/" class="btn-action btn-primary">&larr; Return Home</a>
        <a href="/posts" class="btn-action">Browse Posts</a>
        <a href="/projects" class="btn-action">View Projects</a>
      </div>
    </div>
  </main>

  <footer class="container footer">
    <p>&copy; 2026 Snow</p>
    <ul class="nav-links">
      <li><a href="/terms">Terms of Service</a></li>
      <li><a href="/privacy">Privacy Policy</a></li>
      <li><a href="https://github.com/adieltan" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://discord.gg/dHGqUZNqCu" target="_blank" rel="noopener">Discord</a></li>
    </ul>
  </footer>

  <script>
    const pathEl = document.getElementById("requested-path");
    const pathname = window.location.pathname;
    pathEl.textContent = pathname.length > 36 ? pathname.slice(0, 36) + "..." : pathname;
  </script>

</body>

</html>
